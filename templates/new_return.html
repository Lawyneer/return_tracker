{% extends "base.html" %}
{% block title %}New Return — Tax Return Tracker{% endblock %}
{% block content %}
<h1>Add Tax Return</h1>
<form method="post">
  <label>Return name (individual or company)</label>
  <input name="return_name" size="40" required>
  <label>Tax year</label>
  <input name="tax_year" placeholder="e.g. 2025" required>
  <label>Return type</label>
  <select name="return_type">
    {% for t in return_types %}<option>{{ t }}</option>{% endfor %}
    <option>Other</option>
  </select>
  <label>Due date (YYYY-MM-DD or MM/DD/YYYY)</label>
  <input name="due_date" placeholder="e.g. 04/15/2026">
  <label>Extended due date</label>
  <input name="extended_due_date" placeholder="e.g. 10/15/2026">
  <p><button type="submit">Add Return</button>
     <a href="{{ url_for('returns.index') }}">Cancel</a></p>
</form>
{% endblock %}
