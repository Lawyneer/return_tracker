<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Tax Return Status Tracker</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">

  <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/' ~ theme ~ '.css') }}">
</head>
<body class="auth-page">
<main class="auth-card">
  {% with msgs = get_flashed_messages() %}
  {% if msgs %}
    <div class="flashes">
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    </div>
  {% endif %}
{% endwith %}
  <h1>Tax Return Status Tracker</h1>
  <h2>Sign in</h2>
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username or email</label>
    <input type="text" id="username" name="username"
           autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
